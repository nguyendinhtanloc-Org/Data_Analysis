services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - warehouse_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: mssql
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - mssql_data:/var/opt/mssql
      - ./data/raw:/var/opt/mssql/backup

    networks:
      - warehouse_net

    healthcheck:
      test:
        ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${MSSQL_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  etl:
    build:
      context: .

    container_name: etl
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MSSQL_HOST: mssql
      POSTGRES_HOST: postgres
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./:/app

    working_dir: /app

    networks:
      - warehouse_net

    depends_on:
      postgres:
        condition: service_healthy
      mssql:
        condition: service_healthy

    command: tail -f /dev/null

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  metabase:
    image: metabase/metabase:v0.50.1
    platform: linux/amd64
    container_name: metabase
    restart: unless-stopped

    environment:
      MB_DB_TYPE: ${METABASE_DB_TYPE}
      MB_DB_DBNAME: ${METABASE_DB_DBNAME}
      MB_DB_PORT: ${METABASE_DB_PORT}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASS}
      MB_DB_HOST: ${METABASE_DB_HOST}
      MB_SESSION_COOKIE_SAMESITE: lax
      MB_PASSWORD_COMPLEXITY: strong

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - warehouse_net

    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  postgres_data:
  mssql_data:

networks:
  warehouse_net: